# Builds an UNSIGNED .ipa on a free macOS runner.
#
# Why this exists: EAS "internal distribution" requires a paid Apple Developer
# account, because ad hoc provisioning profiles can only be issued by one. A
# free Apple ID cannot produce them. So the compile happens here without any
# signing at all, and Sideloadly/AltStore signs the result locally with the
# free Apple ID at install time — which is exactly what those tools do.
#
# Run it from the Actions tab (workflow_dispatch), then download the artifact.

name: Build unsigned iOS .ipa

on:
  workflow_dispatch:

jobs:
  build:
    # macOS is required: only Apple's toolchain can compile an iOS binary.
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate the native iOS project
        # The ios/ folder is gitignored and regenerated from app.json, so the
        # native project never drifts from the config.
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods
        working-directory: ios
        run: pod install

      - name: Archive without signing
        run: |
          set -euo pipefail
          # Discover the workspace rather than hardcoding it, so renaming the
          # app in app.json does not silently break this workflow.
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "Building scheme: $SCHEME"

          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            archive

      - name: Package as .ipa
        run: |
          set -euo pipefail
          # An .ipa is just a zip with the .app inside a Payload/ directory.
          # Since the build is unsigned, no export step or export options are
          # involved — xcodebuild -exportArchive would demand credentials.
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$RUNNER_TEMP/App.xcarchive/Products/Applications/"*.app "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -qry Subscriptions-unsigned.ipa Payload
          ls -lh Subscriptions-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Subscriptions-unsigned-ipa
          path: ${{ runner.temp }}/Subscriptions-unsigned.ipa
          retention-days: 30
